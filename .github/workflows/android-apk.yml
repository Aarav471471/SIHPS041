name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - "content/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch: # lets you press "Run workflow" manually in the Actions tab

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The repo has no gradlew / gradle-wrapper.jar, so install Gradle 8.7
      # (the version named in gradle-wrapper.properties) directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: suraksha-ar-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
